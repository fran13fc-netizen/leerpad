<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fast fashion onder de loep · opdrachtenkaart</title>
<style>
:root{
  --ink:#1B1F24; --grey:#5B6470; --line:#D7D2C6; --bg:#F6F3EC; --card:#FFFFFF; --soft:#EFEBE0;
  --c:#0E6E6E; --warn:#B3400F; --ok:#2E7D32;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:21px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 40px}
h1,h2,h3,p{margin:0}

/* groep kiezen */
.home{padding-top:max(28px,env(safe-area-inset-top))}
.home h1{font-size:40px;line-height:1.1;letter-spacing:-.01em}
.home .sub{color:var(--grey);margin-top:8px;font-size:22px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:26px}
.pick button{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px;border-radius:20px;
  background:var(--g);color:#fff;min-height:92px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.pick button:active{transform:translateY(1px)}
.pick .nr{flex:none;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.pick .t1{font-size:15px;letter-spacing:.08em;opacity:.9;text-transform:uppercase}
.pick .t2{font-size:30px;font-weight:800;line-height:1.1}

/* bovenbalk */
.top{background:var(--c);color:#fff;padding:max(14px,env(safe-area-inset-top)) 0 14px}
.top .wrap{display:flex;align-items:center;gap:14px;padding-bottom:0}
.top .who{flex:1;min-width:0}
.top .k{font-size:14px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.top .n{font-size:30px;font-weight:800;line-height:1.1}
.top .mn{font-size:16px;opacity:.92}
.top .wissel{font-size:16px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
.tabs{display:flex;gap:10px;margin:16px 0 14px}
.tabs button{flex:1;padding:14px 12px;border-radius:16px;background:var(--soft);font-weight:700;font-size:19px;text-align:center;border:2px solid transparent;line-height:1.2}
.tabs button small{display:block;font-weight:500;font-size:15px;color:var(--grey)}
.tabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
.tabs button.on small{color:rgba(255,255,255,.9)}

/* stappenbalk */
.strip{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end;margin:4px 0 14px}
.deel{display:flex;flex-direction:column;gap:4px}
.deel .lab{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);padding-left:2px}
.deel .row{display:flex;gap:6px}
.deel+.deel{margin-left:6px;padding-left:10px;border-left:2px solid var(--line)}
.dot{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--c);background:#fff;color:var(--c);font-weight:800;font-size:19px;
  display:flex;align-items:center;justify-content:center}
.dot.done{background:var(--c);color:#fff}
.dot.now{background:#fff;color:var(--c);box-shadow:0 0 0 4px rgba(0,0,0,.1);transform:scale(1.12)}

/* stap */
.card{background:var(--card);border-radius:24px;border:1.5px solid var(--line);padding:24px 26px 22px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.card .head{display:flex;align-items:flex-start;gap:16px}
.card .bignr{flex:none;width:64px;height:64px;border-radius:50%;background:var(--c);color:#fff;font-size:34px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.card h2{font-size:34px;line-height:1.12;letter-spacing:-.01em}
.card .meta{color:var(--grey);font-size:17px;margin-top:4px}
.do{margin-top:18px;font-size:24px;line-height:1.4}
.do b{font-weight:800}
.do p+p{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-block;padding:7px 14px;border-radius:999px;background:var(--soft);border:1.5px solid var(--line);font-size:17px;font-weight:600}
.chip.paraaf{background:#FFF3C9;border-color:#E3C64A}
.box{margin-top:16px;border-radius:16px;padding:14px 18px;background:var(--soft);font-size:20px}
.box.say{background:#fff;border:2px dashed var(--c)}
.box .lab{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-bottom:4px;font-weight:700}
.vraag{background:var(--c);color:#fff;border-radius:18px;padding:16px 20px;margin-top:10px;font-size:26px;font-weight:800;line-height:1.25}
.vraag .lab{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.9;margin-bottom:2px}
.stelling{border-left:8px solid var(--c);padding:6px 0 6px 20px;margin-top:18px;font-size:30px;font-weight:800;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{padding:8px 16px;border-radius:12px;background:var(--c);color:#fff;font-weight:700;font-size:19px}
.reveal{margin-top:16px}
.reveal>button{width:100%;text-align:left;padding:14px 18px;border-radius:16px;border:2px solid var(--c);color:var(--c);font-weight:700;font-size:20px;background:#fff}
.reveal .body{display:none;margin-top:10px}
.reveal.open>button{background:var(--soft)}
.reveal.open .body{display:block}
.four{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.four div{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:19px;line-height:1.35}
.four b{display:block;font-size:20px;color:var(--c);margin-bottom:2px}
@media (max-width:640px){.four{grid-template-columns:1fr}}

/* timer */
.timer{display:flex;align-items:center;gap:14px;margin-top:16px;padding:10px 16px;border-radius:18px;background:var(--soft);flex-wrap:wrap}
.timer .t{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;min-width:150px}
.timer .lbl{color:var(--grey);font-size:16px;flex:1;min-width:120px}
.timer button{padding:14px 22px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:20px;min-width:104px}
.timer button.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.timer.low{background:#FCE9C8}
.timer.low .t{color:var(--warn)}
.timer.end{background:#B3261E}
.timer.end .t,.timer.end .lbl{color:#fff}
.timer.end button{background:#fff;color:#B3261E}
@keyframes blink{50%{opacity:.35}}
.timer.end .t{animation:blink 1s steps(2,start) infinite}

/* ronde */
.ronde{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ronde>div{border-radius:18px;padding:16px 18px;color:#fff}
.ronde .l{font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.ronde .big{font-size:30px;font-weight:800;line-height:1.12;margin-top:2px}
.ronde .s{font-size:18px;margin-top:6px}
@media (max-width:640px){.ronde{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:20px}
.tbl th{background:var(--c);color:#fff;text-align:left;padding:10px 12px;font-size:16px}
.tbl td{padding:10px 12px;border-bottom:1.5px solid var(--line)}
.tbl td:first-child{font-weight:800}
.ol{margin:14px 0 0;padding-left:0;list-style:none;counter-reset:n}
.ol li{counter-increment:n;position:relative;padding:8px 0 8px 48px;font-size:21px}
.ol li::before{content:counter(n);position:absolute;left:0;top:8px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;
  font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px}
.fiche{background:#fff;border:2px solid var(--c);border-radius:16px;padding:14px 18px;font-size:19px}
.fiche p+p{margin-top:8px}
.fiche .src{color:var(--grey);font-size:15px;font-style:italic}
.inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
.inv>div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--g);color:#fff;font-size:24px;font-weight:800}
.inv>div>span{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px}
.inv>div.own{background:#E4DFD2;color:#6B6558}
.inv>div.own>span{background:rgba(0,0,0,.08)}
.inv small{display:block;font-size:14px;font-weight:600}

/* navigatie */
.nav{display:flex;gap:12px;margin-top:20px}
.nav button{flex:1;padding:18px 16px;border-radius:18px;font-weight:800;font-size:23px}
.nav .prev{flex:0 0 32%;background:#fff;border:2px solid var(--line)}
.nav .next{background:var(--c);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.nav .next:active{transform:translateY(2px);box-shadow:none}
.next-up{margin-top:12px;color:var(--grey);font-size:17px;text-align:center}
.regel{margin-top:22px;padding:14px 18px;border-radius:16px;background:var(--soft);font-size:18px;color:var(--ink);display:flex;gap:12px;align-items:center}
.regel b{flex:none;background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;font-size:15px;letter-spacing:.06em}
.klaar{text-align:center;padding:40px 24px}
.klaar h2{font-size:38px}
.klaar p{margin-top:12px;font-size:24px}
.klaar button{margin-top:24px;padding:18px 28px;border-radius:18px;background:var(--c);color:#fff;font-weight:800;font-size:23px}
.klaar button.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var BED = {"1": {"n": "SHEIN", "mn": "marge op verkoop", "vak": "kledingberg", "hulp": "Denk aan: wie maakt het eerste, hoe weet SHEIN wat er verkoopt, en wat gebeurt er daarna?", "f": {"k": "Kleine eerste reeksen, bijbestellen op basis van verkoopgegevens, alleen online verkopen.", "o": "Lagere bedrijfskosten (weinig onverkochte voorraad, geen winkels) en meer verkoop door een groot, snel wisselend aanbod.", "g": "Druk op leveranciers en werknemers (werkweken tot 75 uur volgens 13 ondervraagden), veel uitstoot door vliegtransport, koopdruk (nepkortingen).", "p": "Deels", "pt": "de transportkosten zitten in de prijs of de verzendkosten, maar de klimaatschade en de gevolgen voor werknemers niet volledig.", "b": "Fortune (13 mei 2024), over Public Eye · Reuters, via BNN Bloomberg (13 juni 2025) · ANP (26 mei 2025)"}}, "2": {"n": "Temu", "mn": "makelaarsmodel", "vak": "strategie", "hulp": "Vijf dezelfde T-shirts vallen onder één categorie. Een T-shirt en een horloge vallen onder twee categorieën.", "f": {"k": "Marktplaats zonder eigen productie of voorraad; externe verkopers sturen heel goedkope producten rechtstreeks naar de klant.", "o": "Lage bedrijfskosten (geen voorraad, geen winkels) en inkomsten uit een enorm aanbod en veel kopers.", "g": "Veel pakjes per vliegtuig (uitstoot), onduidelijke werkomstandigheden bij leveranciers, textielafval. Onveilige producten zijn een probleem van consumentenbescherming, geen milieubewijs.", "p": "Neen of deels", "pt": "de klimaatschade van vliegtransport en de afvalverwerking zitten niet volledig in de prijs. De nieuwe EU-regels voor textielafval laten producenten wel een deel van de afvalkosten betalen; het invoerrecht maakt pakjes duurder, maar is geen vergoeding voor de klimaatschade.", "b": "VRT NWS (5 februari 2025) · Business & Human Rights Resource Centre (3 december 2024) · VRT NWS (9 september 2025)"}}, "3": {"n": "Zara", "mn": "marge op verkoop", "vak": "kledingberg", "hulp": "Gebruik de bronkaart over de strategie: hoe vaak per week krijgen de winkels nieuwe modellen, en hoeveel uur duurt de levering?", "f": {"k": "Snel nieuwe mode, twee leveringen per week, een groot deel van de productie dicht bij Europa.", "o": "Meer verkoop tegen de volle prijs en minder onverkochte voorraad, ondanks hogere productiekosten dichtbij.", "g": "Lage lonen in productielanden zoals Bangladesh, transportuitstoot (+10 %), voortdurende stroom nieuwe kleding.", "p": "Deels", "pt": "de hogere productiekosten zitten in de prijs, de klimaatschade en de lage lonen niet volledig.", "b": "Reuters, via BNN Bloomberg (13 juni 2025) · Inditex, Annual report 2024 · WageIndicator (11 december 2023)"}}, "4": {"n": "Primark", "mn": "marge op verkoop", "vak": "werknemers", "hulp": "11,9 pond bedrijfswinst per 100 pond omzet is 11,9 % van de omzet.", "f": {"k": "Zeer lage prijzen, heel grote aantallen, verkoop vooral in grote fysieke winkels.", "o": "Veel omzet door volume; lage bedrijfskosten per stuk en geen verzend- of retourkosten.", "g": "Veel kleding in omloop (kledingberg); risico’s in de keten (Rana Plaza als historisch voorbeeld).", "p": "Deels", "pt": "inzameling en meer duurzaam materiaal zitten in de werking, maar de afvalverwerking en risico’s in de keten niet volledig.", "b": "EEA (26 maart 2025) · VRT NWS (23 april 2023) · FashionNetwork (2 april 2015) · Primark (2 oktober 2025)"}}, "5": {"n": "Vinted", "mn": "makelaarsmodel", "vak": "strategie", "hulp": "De koper betaalt de prijs plus 0,70 euro plus 5 % van de prijs. De verkoper krijgt de prijs.", "f": {"k": "Platform waarop consumenten tweedehands kleding aan elkaar verkopen; de koper betaalt een vergoeding.", "o": "Inkomsten uit elke aankoop zonder eigen productie of voorraad; meer aanbod trekt meer kopers.", "g": "Verzending veroorzaakt uitstoot; niet elke aankoop vervangt nieuwe kleding; het dossier zegt niets over de werkomstandigheden.", "p": "Onvoldoende informatie", "pt": "de vermeden uitstoot is een claim van het bedrijf, geen onafhankelijk onderzoek. ‘Onvoldoende informatie’ is hier een sterk antwoord.", "b": "Ecotextile News (24 juni 2024) · Vinted (29 april 2025) · ANP (25 maart 2025) · OVAM (3 december 2025)"}}};
var KLEUR = {"1":"#0E6E6E","2":"#B3400F","3":"#1D4E89","4":"#7A2E6B","5":"#2E7D32"};
var VRAAG1 = "Hoe verdienen bedrijven geld aan goedkope kleding, en wie betaalt de prijs?";
var VRAAG2 = "Welk bedrijf weegt winst en gevolgen het best af?";
var STELLING = "Een gezin met een beperkt kledingbudget maakt een slechte keuze als het bij Temu koopt.";
var OMSCHRIJVING = "Een bedrijfsstrategie is wat een onderneming wil bereiken (missie, doelstellingen) en met welke keuzes ze dat doet. Elke keuze levert iets op en kost iets, voor het bedrijf en voor andere stakeholders.";
var CONCLUSIE = "Bedrijven verhogen hun opbrengsten of verlagen hun kosten door keuzes in prijs, snelheid, volume en verkoopkanaal. Een deel van de kosten dragen anderen: werknemers, milieu en samenleving.";
var DRIE = "<b>SNEL:</b> steeds nieuwe collecties, sommige merken tot 52 ‘microseizoenen’ per jaar (Kassa, 2021). <b>GOEDKOOP:</b> spotgoedkope prijzen en voortdurende promoties (Test-Aankoop, 2026). <b>VEEL:</b> kleding wordt een wegwerpproduct, de Europeaan kocht in 2022 gemiddeld 19 kg textiel (EEA, 2025).";
var REGEL = "Praat zacht met je groep. Bij het signaal van de leerkracht ben je binnen vijf seconden stil.";

var KEY = "ff-kaart-2";
var S = {g:null, owner:null, les:1, i:{"1":0,"2":0}, t:{}, open:{}};
try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); if(o && typeof o==="object"){ S = Object.assign(S,o); } } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* beurs: wie gaat waar naartoe */
function ronBedrijf(g,r){ return String(((+g - r - 1 + 10) % 5) + 1); }
function naarGroep(g,r){ return String((+g + r - 1) % 5 + 1); }
function rollen(g){ return g==="5" ? ["strategie","werknemers","milieu + kledingberg","strategie (opnieuw)"] : ["strategie","werknemers","milieu","kledingberg"]; }
function gl(g){ return "groep "+g+" · "+BED[g].n; }

/* bouwstenen */
function chips(a,par){ var h = (a||[]).map(function(x){return '<span class="chip">'+x+'</span>';}).join(""); if(par) h += '<span class="chip paraaf">'+par+'</span>'; return h ? '<div class="chips">'+h+'</div>' : ''; }
function reveal(id,label,html){ var o = !!S.open[id]; return '<div class="reveal'+(o?' open':'')+'"><button data-rv="'+id+'">'+(o?'▾ ':'▸ ')+label+'</button><div class="body">'+html+'</div></div>'; }
function vraagBox(t,lab){ return '<div class="vraag"><span class="lab">'+(lab||"Onze vraag")+'</span>'+t+'</div>'; }

/* lesuur 1 */
function stappen1(g){
  var b = BED[g];
  return [
  {deel:"Ontdek", titel:"Jullie zijn investeerders", min:2, body:
    '<div class="do"><p>Vijf bedrijven vragen jullie geld, maar goedkope kleding heeft een prijs die iemand betaalt.</p>'+
    '<p>Eerst leer je met je groep één bedrijf door en door kennen: <b>'+b.n+'</b>. Op het einde van lesuur 2 investeer jij zelf in één bedrijf en leg je uit waarom.</p></div>'+
    '<div class="box"><span class="lab">Doe nu</span>Vul de kop van je logboek in: naam, groep, bedrijf en jouw rol.</div>'+chips(["Logboek p. 1"])},
  {deel:"Ontdek", titel:"Wat betekent ‘fast’?", min:2, body:
    '<div class="do"><p>Denk eerst <b>alleen</b> na: wat betekent ‘fast’ in fast fashion?</p><p>Vertel daarna je idee aan je groep.</p></div>'+
    reveal("1-2-drie","Lees pas daarna: fast fashion in drie woorden",'<div class="box">'+DRIE+'</div>')},
  {deel:"Ontdek", titel:"Krantenkoppen sorteren", min:4, body:

    '<div class="box"><span class="lab">Denk hierover na</span>Welke koppen horen samen, en waarom? Waarom staan die bedrijven zo vaak in het nieuws?</div>'+chips(["Krantenknipsels"])},
  {deel:"Ontdek", titel:"Eén SDG per stapel", min:3, body:
    '<div class="do"><p>Kies bij elke stapel de <b>SDG</b> die er het sterkst door geraakt wordt.</p><p>Schrijf er één kernwoord bij als uitleg.</p></div>'+chips(["SDG-kaart"])},
  {deel:"Ontdek", titel:"Onze onderzoeksvraag", min:2, body:
    '<div class="do"><p>Luister naar de leerkracht. De koppen gaan over vier invalshoeken. Jullie formuleren samen de onderzoeksvraag.</p></div>'+
    '<div class="tags"><span class="tag">strategie</span><span class="tag">werknemers</span><span class="tag">milieu</span><span class="tag">kledingberg</span></div>'+
    reveal("1-5-vraag","Toon onze vraag (nadat de klas ze gezegd heeft)", vraagBox(VRAAG1)+'<div class="box"><span class="lab">Doe nu</span>Schrijf de vraag over in je logboek.</div>')+chips(["Logboek p. 1"])},
  {deel:"Onderzoek", titel:"Lees je eigen bron", min:6, body:
    '<div class="do"><p>Iedereen is expert van <b>één invalshoek</b> en leest enkel zijn eigen bronkaart (dossier p. 1).</p>'+
    '<p><b>Markeer het belangrijkste feit</b> en duid aan: feit uit onderzoek, claim van het bedrijf of historische gebeurtenis.</p></div>'+
    '<div class="box"><span class="lab">Het echte artikel</span>De expert <b>'+b.vak+'</b> leest het artikel via de QR-code in het dossier en beantwoordt de twee leesvragen.</div>'+
    chips(["Dossier p. 1","iPad (artikel)"])},
  {deel:"Onderzoek", titel:"Vertel je feit", min:2, body:
    '<div class="do"><p>Elke expert vertelt zijn feit in <b>één zin</b> aan de groep. Luister goed: de anderen hebben jouw bron niet gelezen.</p></div>'+
    '<div class="box say"><span class="lab">Zo begin je</span>‘Mijn bron is … Het belangrijkste feit: … Dat is een feit uit onderzoek / een claim van het bedrijf / een historische gebeurtenis.’</div>'},
  {deel:"Onderzoek", titel:"Doe-opdracht samen", min:8, body:
    '<div class="do"><p>Maak samen de doe-opdracht op <b>pagina 2 van het dossier</b>.</p><p>Iedereen rekent of denkt mee. De expert strategie noteert.</p></div>'+
    reveal("1-8-hulp","Hulp nodig? Tik hier",'<div class="box">'+b.hulp+'</div>')+
    chips(["Dossier p. 2"],"Paraaf 1: de leerkracht komt langs in je logboek")},
  {deel:"Onderzoek", titel:"A3 · deel 1: ons bewijs", min:6, body:
    '<div class="do"><p>Elke expert vult <b>tegelijk zijn eigen rij</b> in: het belangrijkste feit, de bron (organisatie en datum) en de soort informatie.</p>'+
    '<p>Duid bovenaan het verdienmodel van jullie bedrijf aan: marge op verkoop of makelaarsmodel.</p></div>'+chips(["A3-bedrijfsprofiel"])},
  {deel:"Onderzoek", titel:"A3 · deel 2: de redenering", min:7, body:
    '<div class="do"><p>Bespreek samen de vier vakken. <b>Elk vak heeft één schrijver.</b></p></div>'+
    '<div class="four"><div><b>① Keuze</b>Welke keuze maakt het bedrijf? ‘Dit bedrijf kiest voor …’</div>'+
    '<div><b>② Wat levert het op?</b>Welke opbrengsten stijgen of welke bedrijfskosten dalen?</div>'+
    '<div><b>③ Gevolgen</b>Welke kosten dragen andere stakeholders? Schrijf een bron op.</div>'+
    '<div><b>④ In de prijs?</b>Ja, deels of neen? Waarom? Wie betaalt ze dan wel?</div></div>'+chips(["A3-bedrijfsprofiel"])},
  {deel:"Onderzoek", titel:"A3 · deel 3: één SDG", min:5, body:
    '<div class="do"><p>Kies de <b>SDG</b> die jullie bedrijf het sterkst raakt.</p>'+
    '<p>Oordeel: <b>schaadt · gemengd · helpt · onvoldoende informatie</b>. Geef één controleerbaar feit als bewijs.</p></div>'+
    '<div class="box"><span class="lab">Straks</span>Dit A3 reist in lesuur 2 mee met de ambassadeur van jullie groep.</div>'+
    chips(["A3-bedrijfsprofiel","SDG-kaart"],"Paraaf 2: de leerkracht controleert jullie A3")},
  {deel:"Wat leren we?", titel:"Wat is een bedrijfsstrategie?", min:3, body:
    '<div class="do"><p>Denk even zelf na en bespreek met je buur: wat is het <b>grootste verschil</b> tussen de vijf strategieën, en wat hebben ze <b>gemeen</b>?</p>'+
    '<p>Daarna formuleert de klas wat een <b>bedrijfsstrategie</b> is.</p></div>'+
    reveal("1-12-omschrijving","Toon de omschrijving (pas na het klasgesprek)",'<div class="box say"><span class="lab">Schrijf over in je logboek</span>'+OMSCHRIJVING+'</div>')+
    chips(["Logboek p. 1"])}
  ];
}

/* lesuur 2 */
function rondeStap(g,r){
  var rol = rollen(g)[r-1], naar = naarGroep(g,r), van = ronBedrijf(g,r);
  var f = BED[g].f;
  var fiche = '<div class="fiche"><p><b>① Keuze:</b> '+f.k+'</p><p><b>② Levert op:</b> '+f.o+'</p><p><b>③ Gevolgen:</b> '+f.g+'</p><p><b>④ In de prijs?</b> '+f.p+': '+f.pt+'</p><p class="src">Mogelijke bronnen: '+f.b+'</p></div>';
  return {deel:"Beurs", titel:"Ronde "+r+" · de ambassadeur reist", min:5, body:
    '<div class="ronde"><div style="background:'+KLEUR[g]+'"><span class="l">Ambassadeur van jullie groep</span><div class="big">expert '+rol+'</div>'+
    '<div class="s">gaat met jullie A3, de fiche en de kleurkaartjes naar <b>'+gl(naar)+'</b></div></div>'+
    '<div style="background:'+KLEUR[van]+'"><span class="l">Bij jullie komt</span><div class="big">'+BED[van].n+'</div>'+
    '<div class="s">de ambassadeur van <b>groep '+van+'</b> komt naar jullie tafel. Luister en vul de rij van '+BED[van].n+' in.</div></div></div>'+
    '<ol class="ol"><li><b>De ambassadeur vertelt</b> (ongeveer anderhalve minuut): ‘Dit bedrijf kiest voor … Daardoor … Maar … Dat zit wel / deels / niet in de prijs. Onze SDG is …’ en toont het kleurkaartje.</li>'+
    '<li><b>Luisteraars</b> vullen de rij van dit bedrijf in (logboek p. 2 en 3) en stellen één vraag.</li>'+
    '<li><b>Controle:</b> de ambassadeur leest de fiche voor. Verbeter in een andere kleur.</li>'+
    '<li><b>Bij het signaal</b> gaat de ambassadeur naar de volgende groep.</li></ol>'+
    reveal("2-r"+r+"-fiche","Fiche van "+BED[g].n+" (ambassadeur: pas bij punt 3)",fiche)+
    '<div class="box"><span class="lab">Let op</span>Je eigen bedrijf vul je niet in: streep het door. De ambassadeur neemt de iPad mee.</div>'+
    chips(["A3-bedrijfsprofiel","Kleurkaartjes","Logboek p. 2–3"], r===4 ? "Paraaf 3: de leerkracht controleert je matrix" : "")};
}

function stappen2(g){
  var tr = "";
  for(var r=1;r<=4;r++){
    tr += '<tr><td>'+r+'</td><td>expert '+rollen(g)[r-1]+'</td><td>'+gl(naarGroep(g,r))+'</td><td>'+BED[ronBedrijf(g,r)].n+'</td></tr>';
  }
  var inv = "";
  ["1","2","3","4","5"].forEach(function(k){
    inv += '<div class="'+(k===g?'own':'')+'" style="--g:'+KLEUR[k]+'"><span>'+k+'</span><div>'+BED[k].n+(k===g?'<small>jullie bedrijf: niet kiezen</small>':'')+'</div></div>';
  });
  return [
  {deel:"Start", titel:"De stelling", min:4, body:
    '<div class="stelling">'+STELLING+'</div>'+
    '<div class="do"><p><b>Sta op</b> als je akkoord bent, <b>blijf zitten</b> als je niet akkoord bent. Leg uit waarom.</p></div>'+
    reveal("2-1-vraag","Toon onze vraag (nadat de klas ze gezegd heeft)", vraagBox(VRAAG2)+'<div class="box"><span class="lab">Doe nu</span>Schrijf de vraag boven je vergelijkingsmatrix.</div>')+chips(["Logboek p. 2"])},
  {deel:"Beurs", titel:"De beurs: zo werkt het", min:1, body:
    '<div class="do"><p>Je hoort van de <b>vier andere bedrijven</b> hoe ze geld verdienen en wie de prijs betaalt.</p>'+
    '<p>In elke ronde reist <b>één ambassadeur</b> van jullie groep met jullie A3 naar een andere groep. De anderen blijven zitten en luisteren naar de ambassadeur die bij hen komt.</p></div>'+
    '<table class="tbl"><tr><th>Ronde</th><th>Ambassadeur</th><th>Gaat naar</th><th>Bij jullie komt</th></tr>'+tr+'</table>'+
    '<div class="box"><span class="lab">Elke ronde duurt 5 minuten</span>Op het signaal van de leerkracht verhuist de ambassadeur.</div>'+chips(["A3-bedrijfsprofiel","Kleurkaartjes","Logboek p. 2–3"])},
  rondeStap(g,1), rondeStap(g,2), rondeStap(g,3), rondeStap(g,4),
  {deel:"Beslis", titel:"Wie betaalt de prijs?", min:3, body:
    '<div class="do"><p>Bespreek in je groep: wat hebben we gehoord? Welke kosten dragen anderen dan het bedrijf zelf?</p><p>Twee groepen antwoorden op de vraag van lesuur 1.</p></div>'+
    reveal("2-7-conclusie","Toon de conclusie (nadat de klas ze gezegd heeft)",'<div class="box say"><span class="lab">Conclusie van de klas</span>'+CONCLUSIE+'</div>')+
    '<div class="box"><span class="lab">Doe nu</span>Schrijf de conclusie in je eigen woorden op logboek p. 3.</div>'+chips(["Logboek p. 3"])},
  {deel:"Beslis", titel:"De Oxfam-som", min:3, body:
    '<div class="do"><p>Een T-shirt van <b>€ 29</b>: ongeveer <b>0,6 %</b> gaat naar het loon van de arbeiders.</p>'+
    '<p>Hoeveel euro is dat? Wat kost een <b>dubbel loon</b> de koper? Reken samen.</p></div>'+
    '<div class="box"><span class="lab">Denk daarna na</span>Wat merk je op? Waarom kiezen merken daar dan niet voor?</div>'+
    '<p style="margin-top:10px;font-size:16px;color:var(--grey)">Bron: Oxfam België, 16 november 2021</p>'+chips(["Logboek p. 3"])},
  {deel:"Beslis", titel:"Investeer", min:3, body:
    '<div class="do"><p>In welk bedrijf investeer jij? <b>Niet in jullie eigen bedrijf.</b></p>'+
    '<p>Schrijf het nummer op je wisbordje en toon het op het teken van de leerkracht.</p></div>'+
    '<div class="inv">'+inv+'</div>'+
    '<div class="box"><span class="lab">Denk aan</span>Waarom investeer jij hierin? Welke kosten neemt dit bedrijf zelf, en welke dragen anderen?</div>'+chips(["Wisbordje"])},
  {deel:"Beslis", titel:"Eindopdracht · eerst met je buur", min:3, body:
    '<div class="do"><p>Vertel je buur <b>in welk bedrijf je investeert en waarom</b>. Je buur zoekt het zwakste punt in jouw redenering. Wissel na anderhalve minuut.</p></div>'+
    '<div class="box say"><span class="lab">Zo begin je</span>‘Ik investeer in … omdat dit bedrijf kiest voor … Daardoor … Het gevolg voor anderen is …’</div>'},
  {deel:"Beslis", titel:"Eindopdracht · alleen en in stilte", min:9, body:
    '<div class="do"><p>Maak <b>alleen en in stilte</b> de vier vragen op logboek p. 4. Gebruik je vergelijkingsmatrix.</p>'+
    '<p>Je krijgt punten voor je economische argumenten en je bronnen, <b>niet voor je keuze</b>.</p></div>'+
    '<div class="box"><span class="lab">Klaar?</span>Controleer of je bij elk argument een bron hebt (organisatie en datum) en geef je logboek af aan de leerkracht.</div>'+chips(["Logboek p. 4"])}
  ];
}

function stappen(g,les){ return les===1 ? stappen1(g) : stappen2(g); }

/* timer */
function tkey(les,i){ return les+"-"+i; }
function tget(k,min){ var t = S.t[k]; if(!t){ t = S.t[k] = {left:min*60, end:null, done:false}; } return t; }
function tleft(t){ return t.end ? Math.max(0, Math.round((t.end - Date.now())/1000)) : t.left; }
function fmt(s){ var m = Math.floor(s/60), r = s%60; return m+":"+(r<10?"0":"")+r; }
function tstart(k,min){ var t = tget(k,min); if(t.end) return; if(t.left<=0){ t.left = min*60; t.done = false; } t.end = Date.now()+t.left*1000; save(); }
function tpause(k,min){ var t = tget(k,min); if(!t.end) return; t.left = tleft(t); t.end = null; save(); }
function treset(k,min){ S.t[k] = {left:min*60, end:null, done:false}; save(); }
function tick(){
  var el = document.getElementById("timer"); if(!el || !S.g) return;
  var st = stappen(S.g,S.les)[S.i[S.les]]; if(!st) return;
  var k = tkey(S.les,S.i[S.les]), t = tget(k,st.min), s = tleft(t);
  if(t.end && s<=0){ t.left = 0; t.end = null; t.done = true; save(); }
  s = tleft(t);
  var cls = "timer";
  if(t.done && s<=0) cls += " end"; else if(t.end && s<=30) cls += " low";
  el.className = cls;
  el.querySelector(".t").textContent = fmt(s);
  var go = el.querySelector("[data-t=go]");
  go.textContent = t.end ? "Pauze" : (t.done ? "Opnieuw" : (t.left < st.min*60 ? "Verder" : "Start"));
  el.querySelector(".lbl").textContent = (t.done && s<=0) ? "Tijd om! Rond af en ga naar de volgende stap." : "Tijd voor deze stap: "+st.min+" min";
}
setInterval(tick,250);
document.addEventListener("visibilitychange",tick);

/* weergave */
var app = document.getElementById("app");
function render(){
  if(!S.g){ return home(); }
  var g = S.g, b = BED[g], list = stappen(g,S.les), i = S.i[S.les];
  if(i<0) i = S.i[S.les] = 0;
  document.documentElement.style.setProperty("--c",KLEUR[g]);
  var h = '<div class="top"><div class="wrap"><div class="who"><div class="k">Groep '+g+'</div><div class="n">'+b.n+'</div><div class="mn">'+b.mn+'</div></div>'+
          '<button class="wissel" data-act="wissel">Andere groep</button></div></div><div class="wrap">'+
          '<div class="tabs"><button data-les="1" class="'+(S.les===1?'on':'')+'">Lesuur 1<small>Ontdek en onderzoek</small></button>'+
          '<button data-les="2" class="'+(S.les===2?'on':'')+'">Lesuur 2<small>De beurs en jouw beslissing</small></button></div>';
  if(i>=list.length){
    h += '<div class="card klaar"><h2>'+(S.les===1?'Lesuur 1 is klaar':'Goed gewerkt, investeerders!')+'</h2>'+
         '<p>'+(S.les===1?'Bewaar je logboek. Het A3 van jullie groep reist in lesuur 2 mee met de ambassadeur.':'Geef je logboek af aan de leerkracht.')+'</p>'+
         (S.les===1?'<p><button data-les="2">Naar lesuur 2 →</button></p>':'')+
         '<p><button class="sec" data-act="terug">← Terug naar de laatste stap</button></p></div>';
  } else {
    var groups = [], cur = null;
    list.forEach(function(s,idx){ if(!cur || cur.deel!==s.deel){ cur = {deel:s.deel, items:[]}; groups.push(cur); } cur.items.push(idx); });
    h += '<div class="strip">'+groups.map(function(gr){
      return '<div class="deel"><div class="lab">'+gr.deel+'</div><div class="row">'+gr.items.map(function(idx){
        return '<button class="dot'+(idx<i?' done':'')+(idx===i?' now':'')+'" data-go="'+idx+'" aria-label="Stap '+(idx+1)+'">'+(idx+1)+'</button>';
      }).join("")+'</div></div>';
    }).join("")+'</div>';
    var st = list[i], k = tkey(S.les,i);
    h += '<div class="card"><div class="head"><div class="bignr">'+(i+1)+'</div><div><h2>'+st.titel+'</h2><div class="meta">Stap '+(i+1)+' van '+list.length+' · '+st.min+' min</div></div></div>'+
         '<div class="timer" id="timer"><div class="t">'+fmt(tleft(tget(k,st.min)))+'</div><div class="lbl"></div>'+
         '<button data-t="go">Start</button><button class="sec" data-t="reset">Opnieuw</button></div>'+
         '<div class="stepbody">'+st.body+'</div></div>'+
         '<div class="nav">'+(i>0?'<button class="prev" data-act="prev">← Vorige</button>':'')+
         '<button class="next" data-act="next">'+(i===list.length-1?'Klaar ✓':'Volgende stap →')+'</button></div>'+
         (i<list.length-1?'<div class="next-up">Straks: stap '+(i+2)+' · '+list[i+1].titel+'</div>':'');
  }
  h += '<div class="regel"><b>REGEL</b><span>'+REGEL+'</span></div></div>';
  app.innerHTML = h;
  tick();
}
function home(){
  document.documentElement.style.setProperty("--c","#1B1F24");
  var h = '<div class="wrap home"><h1>Fast fashion onder de loep</h1><p class="sub">Kies jullie groep. De naam van jullie bedrijf staat op de kaart op jullie tafel.</p><div class="pick">';
  ["1","2","3","4","5"].forEach(function(k){
    h += '<button style="--g:'+KLEUR[k]+'" data-g="'+k+'"><span class="nr">'+k+'</span><span><span class="t1">Groep '+k+'</span><br><span class="t2">'+BED[k].n+'</span></span></button>';
  });
  h += '</div></div>';
  app.innerHTML = h;
}

document.addEventListener("click",function(e){
  var el = e.target.closest("button"); if(!el) return;
  var d = el.dataset;
  if(d.g){ if(S.owner!==d.g){ S.les = 1; S.i = {"1":0,"2":0}; S.t = {}; S.open = {}; } S.g = d.g; S.owner = d.g; save(); render(); window.scrollTo(0,0); return; }
  if(d.act==="wissel"){ S.g = null; save(); render(); return; }
  if(d.les){ S.les = +d.les; save(); render(); window.scrollTo(0,0); return; }
  if(d.go!==undefined){ S.i[S.les] = +d.go; save(); render(); return; }
  if(d.act==="next"){ S.i[S.les] += 1; save(); render(); window.scrollTo(0,0); return; }
  if(d.act==="prev"){ S.i[S.les] = Math.max(0,S.i[S.les]-1); save(); render(); window.scrollTo(0,0); return; }
  if(d.act==="terug"){ S.i[S.les] = stappen(S.g,S.les).length-1; save(); render(); return; }
  if(d.rv){ S.open[d.rv] = !S.open[d.rv]; save(); render(); return; }
  if(d.t){
    var st = stappen(S.g,S.les)[S.i[S.les]], k = tkey(S.les,S.i[S.les]), t = tget(k,st.min);
    if(d.t==="go"){ if(t.end) tpause(k,st.min); else tstart(k,st.min); }
    if(d.t==="reset"){ treset(k,st.min); }
    tick(); return;
  }
});
render();
</script>
</body>
</html>
