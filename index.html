<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><title>Fast fashion onder de loep - leerpad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Concept: elke stap is een prijskaartje aan een kledingstuk. Eén kolom, grote knoppen, stemniveau als volumebalk. */
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#FAF8F3; --ink:#1B1F24; --ink2:#5B6168; --line:#E2DCD0;
  --accent:#0E6E6E; --accent-ink:#FFFFFF; --accent-soft:#E3F0EE;
  --lv0:#9A3B32; --lv0-bg:#F7E9E6; --lv1:#8A6212; --lv1-bg:#F6EDD6; --lv2:#2D6A4A; --lv2-bg:#E3F0E8;
  --ok:#2D6A4A; --ok-bg:#E3F0E8; --no:#9A3B32; --no-bg:#F7E9E6; --hint-bg:#F8F1DC; --focus:#0E6E6E;
  --f-head:"Space Grotesk","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191D; --surface:#1D2227; --surface2:#232A30; --ink:#ECEFF1; --ink2:#A7AEB5; --line:#343C44;
  --accent:#5FBDB6; --accent-ink:#0C1A19; --accent-soft:#1E3533;
  --lv0:#F0A29A; --lv0-bg:#3A2123; --lv1:#E8C170; --lv1-bg:#372D15; --lv2:#8BD3A8; --lv2-bg:#1B3226;
  --ok:#8BD3A8; --ok-bg:#1B3226; --no:#F0A29A; --no-bg:#3A2123; --hint-bg:#352F19; --focus:#5FBDB6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191D; --surface:#1D2227; --surface2:#232A30; --ink:#ECEFF1; --ink2:#A7AEB5; --line:#343C44;
  --accent:#5FBDB6; --accent-ink:#0C1A19; --accent-soft:#1E3533;
  --lv0:#F0A29A; --lv0-bg:#3A2123; --lv1:#E8C170; --lv1-bg:#372D15; --lv2:#8BD3A8; --lv2-bg:#1B3226;
  --ok:#8BD3A8; --ok-bg:#1B3226; --no:#F0A29A; --no-bg:#3A2123; --hint-bg:#352F19; --focus:#5FBDB6; color-scheme:dark}

/* kleur per fase, per groep en voor de timer */
:root{
  --fm:#B8390A; --fm-soft:#FDEBDD; --fa:#0E6E6E; --fa-soft:#E3F0EE; --fs:#6D3FC0; --fs-soft:#EEE7FA;
  --g1:#1D4ED8; --g2:#BE185D; --g3:#3F7D14; --g4:#A16207; --g5:#475569; --on-grp:#FFFFFF;
  --end-bg:#B3261E; --end-ink:#FFFFFF; --warn-bg:#FBEFD0; --warn-ink:#7A4B00; --warn-line:#D49A1A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fm:#F5975B; --fm-soft:#3A2417; --fa:#5FBDB6; --fa-soft:#1E3533; --fs:#B8A2F4; --fs-soft:#2B2342;
  --g1:#7AA2FF; --g2:#F58BC0; --g3:#9BD66B; --g4:#F2C14E; --g5:#AAB7C8; --on-grp:#101418;
  --end-bg:#E5625A; --end-ink:#1A0A09; --warn-bg:#3A2E10; --warn-ink:#F3C969; --warn-line:#B98A1E}}
:root[data-theme="dark"]{
  --fm:#F5975B; --fm-soft:#3A2417; --fa:#5FBDB6; --fa-soft:#1E3533; --fs:#B8A2F4; --fs-soft:#2B2342;
  --g1:#7AA2FF; --g2:#F58BC0; --g3:#9BD66B; --g4:#F2C14E; --g5:#AAB7C8; --on-grp:#101418;
  --end-bg:#E5625A; --end-ink:#1A0A09; --warn-bg:#3A2E10; --warn-ink:#F3C969; --warn-line:#B98A1E}
.wrap[data-f="m"]{--accent:var(--fm);--accent-soft:var(--fm-soft);--focus:var(--fm)}
.wrap[data-f="a"]{--accent:var(--fa);--accent-soft:var(--fa-soft);--focus:var(--fa)}
.wrap[data-f="s"]{--accent:var(--fs);--accent-soft:var(--fs-soft);--focus:var(--fs)}
.wrap[data-g="1"]{--grp:var(--g1)}.wrap[data-g="2"]{--grp:var(--g2)}.wrap[data-g="3"]{--grp:var(--g3)}
.wrap[data-g="4"]{--grp:var(--g4)}.wrap[data-g="5"]{--grp:var(--g5)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
.wrap{max-width:840px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 .6em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* kop */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-top:6px solid var(--grp,var(--line));border-bottom:1px solid var(--line)}
.gdot{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--grp,var(--accent));color:var(--on-grp);font:700 15px/1 var(--f-head)}
.gdot::before{content:attr(data-n)}
.gbadge{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:3px 14px 3px 4px;border-radius:999px;background:var(--surface);border:2px solid var(--grp,var(--line));font-weight:700;font-size:15px}
.gbadge[hidden]{display:none}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:700;font-size:17px;letter-spacing:.01em;flex:1 1 220px;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink2);letter-spacing:0}
.tabs{display:flex;gap:6px}
.tab{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.menu-btn{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.prog{display:flex;gap:4px;margin-top:10px}
.seg{flex:1;height:12px;border-radius:6px;background:var(--c,var(--accent));opacity:.28;border:0;padding:0;cursor:default;min-width:0}
.seg[data-f="m"]{--c:var(--fm)}.seg[data-f="a"]{--c:var(--fa)}.seg[data-f="s"]{--c:var(--fs)}
.seg.done{cursor:pointer;opacity:.7}
.seg.cur{opacity:1;cursor:default;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.seg.blk{background:repeating-linear-gradient(135deg,var(--c) 0 4px,transparent 4px 8px);opacity:.4}
.prog-cap{margin-top:8px;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.prog-cap b{color:var(--ink)}
.stamps{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.stamps .lbl{margin-left:4px;font-size:14px}
.st{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px dashed var(--ink2);color:var(--ink2);font:700 13px/1 var(--f-head)}
.st::before{content:attr(data-n)}
.st.on{border:2px solid var(--grp,var(--accent));background:var(--grp,var(--accent));color:var(--on-grp);transform:rotate(-5deg)}
.st.on::before{content:"\2713";font-size:16px}
@media (prefers-reduced-motion:no-preference){.st.pop{animation:stampin .6s cubic-bezier(.2,.8,.3,1)}}
@keyframes stampin{0%{transform:scale(2.6) rotate(-30deg);opacity:0}55%{transform:scale(.88) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-5deg)}}

/* kaart = prijskaartje */
.card{background:var(--surface);border:1.5px solid var(--line);border-top:7px solid var(--accent);border-radius:16px;margin-top:18px;padding:20px 20px 22px}
@media (prefers-reduced-motion:no-preference){.card.enter{animation:cardin .25s ease-out}}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}}
.tagrow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;position:relative;padding:8px 16px 8px 28px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--f-head);font-weight:700;font-size:17px;letter-spacing:.03em;clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:12px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--surface);transform:translateY(-50%)}
.fase{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tagrow .fase{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:5px 12px;border-radius:999px}
.card h2{font-size:30px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:15px;font-weight:500}
.chip b{font-weight:700}
.lvl{border-width:1.5px;font-weight:600}
.lvl.l0{background:var(--lv0-bg);color:var(--lv0);border-color:var(--lv0)}
.lvl.l1{background:var(--lv1-bg);color:var(--lv1);border-color:var(--lv1)}
.lvl.l2{background:var(--lv2-bg);color:var(--lv2);border-color:var(--lv2)}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.bars i{display:block;width:5px;border-radius:2px;background:currentColor;opacity:.25}
.bars i:nth-child(1){height:7px}.bars i:nth-child(2){height:12px}.bars i:nth-child(3){height:18px}
.bars i.on{opacity:1}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;margin:-6px 0 16px;font-size:14.5px;color:var(--ink2);font-weight:500}
.meta b{color:var(--ink);font-weight:600}
.meta .lv{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.meta .lv.l0{color:var(--lv0)}.meta .lv.l1{color:var(--lv1)}.meta .lv.l2{color:var(--lv2)}
.meta .bars{height:14px}.meta .bars i:nth-child(1){height:5px}.meta .bars i:nth-child(2){height:9px}.meta .bars i:nth-child(3){height:14px}.meta .bars i{width:4px}
.doe{margin:0 0 16px;padding-left:1.4em;display:grid;gap:10px;font-size:19px}
.doe li::marker{font-weight:700;color:var(--accent)}
body:not(.print) .doe{list-style:none;padding-left:0;gap:14px}
body:not(.print) .doe>li{counter-increment:dn;position:relative;padding-left:50px;min-height:34px}
body:not(.print) .doe{counter-reset:dn}
body:not(.print) .doe>li::before{content:counter(dn);position:absolute;left:0;top:-2px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 17px/34px var(--f-head);text-align:center}
.lk{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-weight:700;font-size:20px;margin-bottom:16px}

.note{border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--surface2);border:1px solid var(--line)}
.note.hint{background:var(--hint-bg)}
.note h3{font-size:16px;margin-bottom:6px}
.note ul{margin:6px 0 0;padding-left:1.2em}
details{margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:22px;font-weight:700;color:var(--accent)}
details[open]>summary::before{content:"–"}
details>div{padding:0 14px 14px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{min-height:40px;padding:0 14px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kn{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kn b{font-family:var(--f-head);letter-spacing:.04em;font-size:15px;display:block;margin-bottom:4px}
.kn small{color:var(--ink2);display:block;margin-top:6px;font-size:14px}

.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:8px 0 14px}
.pick button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;padding:8px 10px;text-align:left}
.pick button small{display:block;font-weight:500;color:var(--ink2);font-size:13px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--accent-soft);margin-bottom:14px;font-weight:600}
.who.s{padding:0;border-radius:0;background:none;font-size:16px;color:var(--ink);font-weight:600;margin:0 0 14px;gap:8px 10px}
.who.s .gdot{width:30px;height:30px}
.who.s .pill{font-size:13px;padding:0 8px;border-width:1px;border-color:var(--grp,var(--accent));font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1.5px solid var(--accent);font-size:14px;font-weight:600}

.timer{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:14px 16px 16px;border:2px solid var(--accent);border-radius:14px;margin:0 0 18px;background:var(--accent-soft);position:relative;overflow:hidden}
.timer .t{font-family:var(--f-head);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;min-width:3.6ch;color:var(--accent)}
.timer .btn{margin-left:0}
.timer .btn:first-of-type{margin-left:auto}
.timer .tbar{flex:0 0 100%;height:12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.timer .tbar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:6px;transition:width .5s linear,background-color .3s}
.timer .msg{flex:0 0 100%;font-family:var(--f-head);font-weight:700;font-size:22px;min-height:0}
.timer .msg:empty{display:none}
.timer.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.timer.warn .t,.timer.warn .msg{color:var(--warn-ink)}
.timer.warn .tbar i{background:var(--warn-line)}
.timer.end{background:var(--end-bg);border-color:var(--end-bg);color:var(--end-ink)}
.timer.end .t,.timer.end .msg{color:var(--end-ink)}
.timer.end .btn.ghost{color:var(--end-ink);border-color:var(--end-ink)}
.timer.end .btn:not(.ghost){background:var(--end-ink);color:var(--end-bg);border-color:var(--end-ink)}
.timer.end .tbar{background:rgba(255,255,255,.25);border-color:transparent}
@media (prefers-reduced-motion:no-preference){.timer.end{animation:endpulse 1.2s ease-in-out 3}}
@keyframes endpulse{50%{transform:scale(1.015)}}

.fb{font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.q{display:grid;gap:8px;grid-template-columns:1fr auto;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q label{font-weight:500}
.q .ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q input[type=text]{min-height:48px;width:9.5em;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px}
.q .res{grid-column:1/-1}
.sortlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}
.sortlist li{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sortlist li span{flex:1}
.sortlist button{min-width:44px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.sortlist .nr{min-width:1.4em;font-family:var(--f-head);font-weight:700;color:var(--accent)}
.tick{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:6px 0;cursor:pointer}
.tick input{width:26px;height:26px;margin-top:1px;accent-color:var(--accent);flex:none}

table.fiche{width:100%;border-collapse:collapse;margin:8px 0}
table.fiche th,table.fiche td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;font-size:16px}
table.fiche th{background:var(--surface2);width:7.5em;font-family:var(--f-head)}
.scroll{overflow-x:auto}
table.rondes{border-collapse:collapse;width:100%}
table.rondes th,table.rondes td{border:1px solid var(--line);padding:10px 12px;text-align:left}
table.rondes th{background:var(--surface2)}

.lock{border:2px dashed var(--accent);border-radius:14px;padding:16px;background:var(--surface2)}
.lock.open{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.lockrow{display:flex;gap:18px;align-items:center}
.lockrow p{margin:0 0 .4em}
.bigstamp{flex:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:50%;border:5px double var(--grp,var(--ok));color:var(--grp,var(--ok));transform:rotate(-8deg);font-family:var(--f-head);line-height:1}
.bigstamp small{font-size:12px;font-weight:700;letter-spacing:.14em}
.bigstamp b{font-size:38px;margin-top:2px}
@media (prefers-reduced-motion:no-preference){.bigstamp.pop{animation:bigin .7s cubic-bezier(.2,.8,.3,1)}}
@keyframes bigin{0%{transform:scale(3) rotate(-35deg);opacity:0}55%{transform:scale(.9) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.code{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.code input{min-height:52px;width:8em;text-align:center;font-family:var(--f-head);font-size:26px;letter-spacing:.2em;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}

.nav{position:sticky;bottom:0;z-index:15;margin-top:18px;padding:12px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}
.nav .btn{flex:0 1 auto}
.nav .next{flex:1 1 auto;max-width:320px;margin-left:auto;font-size:19px}
.nav .next:not(:disabled)::after{content:" \2192"}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-top:14px;padding:16px 18px}
.panel h3{font-size:19px;margin-bottom:8px}
.lvl-legend{display:grid;gap:8px;margin:8px 0 12px}
.lvl-legend .chip{width:100%;border-radius:12px;justify-content:flex-start}
.punten{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}
.punten div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.punten b{display:block;font-family:var(--f-head);font-size:26px;line-height:1}
.punten span{font-size:14px;color:var(--ink2)}
.muted{color:var(--ink2)}

/* papieren noodversie (#print) */
body.print{background:#fff;color:#111;font-size:13px;line-height:1.4;padding-block:0}
body.print .top,body.print #panel,body.print .nav{display:none}
.pv{max-width:none}
.pv h1{font-size:24px;margin:0 0 4px}
.pv h2.les{font-size:19px;margin:20px 0 8px;border-bottom:2px solid #111;padding-bottom:4px;break-after:avoid}
.pv .stap{break-inside:avoid;border:1.5px solid #777;border-radius:8px;padding:9px 12px;margin:9px 0;background:#fff}
.pv .stap h3{font-size:16px;margin:0 0 6px}
.pv .stap .doe{margin:6px 0;gap:3px;font-size:1em}

function paperText(t){

   .replace(/ Klik daarna op ‘Toon de onderzoeksvraag’ en vergelijk\./,"")

   .replace(/Na het klasgesprek: toon hieronder de omschrijving en noteer ze in je logboek \(p\. 1\)\./,"Na het klasgesprek noteer je de omschrijving van de leerkracht in je logboek (p. 1).")
   .replace(/Vul eerst in op papier\. Controleer daarna hier\./,"Vul in op papier. De leerkracht controleert bij stempel 1.")
   .replace(/Klaar met de open vraag\? Toon het mogelijk antwoord en vergelijk\./,"Klaar met de open vraag? Vergelijk met de leerkracht.")
   .replace(/Controleer daarna hieronder en verbeter met een andere kleur\./,"Controleer daarna met de leerkracht en verbeter met een andere kleur.")
   .replace(/Controleer je antwoorden hieronder\./,"Controleer je antwoorden met de leerkracht.")
   .replace(/de knop ‘Hulp nodig\?’/,"de hulptekst bij de stap")
   .replace(/Leg de iPad plat in het midden van je groep\. Kies hieronder jullie groep en wie met deze iPad werkt\./,"Vul de kop van je logboek in: je groep, bedrijf en rol staan op dia 1.")
   .replace(/Klik pas op ‘Volgende’ als je stap af is\./,"Ga pas naar de volgende stap als je stap af is.")
   .replace(/Controleer met de tabel hieronder of je antwoord sterk is\./,"Controleer met de tabel hierboven of je antwoord sterk is.")
   .replace(/Klik op ‘Naar lesuur 2’\./,"Ga naar lesuur 2.");
}
function printView(){
  document.body.classList.add("print");

  mainEl.innerHTML="";
  var pv=h("div",{class:"pv"});
  pv.append(h("h1",null,"Fast fashion onder de loep · leerpad op papier"),
    h("p",null,"Noodversie voor als de iPad of de link niet werkt. Alle stappen staan in dezelfde volgorde. Stempelpunten krijgen een paraaf van de leerkracht, zonder code."),
    h("div",{html:paperText(afsprakenNode().innerHTML)}));
  var rt=h("table",null,h("tr",null,h("th",null,"Groep (bedrijf)"),h("th",null,"Ronde 1"),h("th",null,"Ronde 2"),h("th",null,"Ronde 3"),h("th",null,"Ronde 4")));
  for(var g=1;g<=5;g++){var tr=h("tr",null,h("td",null,"Groep "+g+" · "+BEDRIJVEN[g].n));
    for(var r=1;r<=4;r++){var c=compVoorRonde(g,r);tr.append(h("td",null,BEDRIJVEN[c].n))}rt.append(tr)}
  pv.append(h("h2",{class:"les"},"Lesuur 2 · wie leest welk A3?"),rt,h("p",null,"Op het signaal brengt de expert werknemers het A3 naar de volgende groep (groep 5 naar groep 1) en komt rustig terug."));
  [1,2].forEach(function(les){
    pv.append(h("h2",{class:"les"},LESSEN[les].titel));
    LESSEN[les].steps.forEach(function(st,i){
      var box=h("section",{class:"stap"});
      box.append(h("h3",null,"Stap "+(i+1)+" · "+st.titel+" ",h("span",{class:"muted",style:"font-weight:500;font-size:12px"},"("+st.fase+")")));

      if(st.min)ch.append(h("span",{class:"chip"},"Richttijd "+st.min+" min"));
      ch.append(lvlChip(st.lvl));if(st.waar)ch.append(h("span",{class:"chip"},"Noteer: "+st.waar));
      box.append(ch);
      var doe=st.lock?st.doe.slice(0,2):st.doe;
      if(st.id.indexOf("l2-r")===0)doe=["Het A3 bij jullie is dat van een andere groep (zie de tabel). Controleer of het juiste bedrijf bovenaan staat.","<b>Lees</b> het A3, vooral deel 1 en 2. Zoek ① de keuze, ② wat ze oplevert, ③ één gevolg met bron en ④ of het in de prijs zit.","<b>Vul</b> de rij van dit bedrijf in je matrix in. Kernwoorden volstaan.","<b>Controleer</b> met de fiche van de leerkracht en verbeter met een andere kleur."];
      var ol=h("ol",{class:"doe"});doe.forEach(function(d){ol.append(h("li",{html:paperText(d)}))});box.append(ol);
      var pk=PAPER[st.id]||(st.id.indexOf("l2-r")===0?PAPER["l2-r1"]:null);
      if(pk)box.append(h("div",{class:"note",html:pk}));
      if(st.lock)box.append(h("div",{class:"note",html:"<b>Stempelpunt.</b> "+st.controle+"<br>"+st.wacht}));
      if(typeof st.hulp==="string")box.append(h("div",{class:"note",html:"<b>Hulp:</b> "+st.hulp}));
      pv.append(box);
    });
  });
  mainEl.append(pv);
}
